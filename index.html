<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>OBS Glass Counter</title>
    <!-- Incluindo a biblioteca ComfyJS para os comandos do chat da Twitch -->
    <script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
    <style>
        /* Base transparente e fonte limpa */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            background: transparent; /* Importante para o OBS */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: flex-start;
        }

        /* CONTAINER PRINCIPAL: Apenas Glassmorphism limpo */
        .container {
            display: flex;
            gap: 25px;
            padding: 15px 25px;
            border-radius: 16px;
            width: fit-content;
            
            /* Efeito Glass (Vidro Fosco) */
            background: rgba(15, 15, 25, 0.65); /* Fundo escuro semi-transparente */
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            
            /* Borda sutil e translúcida, sem neon */
            border: 1px solid rgba(255, 255, 255, 0.1); 
            
            /* Sombra escura simples para dar profundidade e destacar do fundo do jogo */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        /* Estilização individual das estatísticas */
        .stat {
            text-align: center;
            min-width: 60px;
            position: relative;
        }

        /* Rótulos (Win, Loss, WR) */
        .label {
            font-size: 11px;
            text-transform: uppercase;
            color: #d1d5db;
            letter-spacing: 1.5px;
            margin-bottom: 3px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* Os valores numéricos grandes */
        .val {
            font-size: 32px;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9); /* Sombra escura para leitura no OBS */
        }

        /* Cores sólidas e limpas para os números */
        .win { 
            color: #4ade80; 
        }

        .lose { 
            color: #f87171; 
        }

        .wr { 
            color: #fbbf24; /* Amarelo/Dourado padrão */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stat"><div class="label">Wins</div><div id="w" class="val win">0</div></div>
        <div class="stat"><div class="label">Loss</div><div id="l" class="val lose">0</div></div>
        <div class="stat"><div class="label">WR</div><div id="wr" class="val wr">0%</div></div>
    </div>

    <script>
        let wins = 0, loses = 0;
        
        // --- CONFIGURAÇÃO ---
        const channel = "gzikka"; // Mude para o nome do seu canal na Twitch

        function update() {
            const total = wins + loses;
            const rate = total === 0 ? 0 : Math.round((wins / total) * 100);
            document.getElementById('w').innerText = wins;
            document.getElementById('l').innerText = loses;
            document.getElementById('wr').innerText = rate + '%';
        }

        ComfyJS.onCommand = (user, command, message, flags) => {
            // Apenas o streamer (broadcaster) ou moderadores podem mudar
            if (flags.broadcaster || flags.mod) {
                if (command === "win") { wins++; update(); }
                if (command === "loss") { loses++; update(); }
                if (command === "reset") { wins = 0; loses = 0; update(); }
            }
        };
        ComfyJS.Init(channel);
    </script>
</body>
</html>
